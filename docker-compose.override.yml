# =============================================================================
# Evil Sheep Trap — Development Overrides
# Automatically applied when running `docker compose up` in dev mode.
# =============================================================================

services:
  svg-chat:
    container_name: evil-sheep-trap-dev
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - ENABLE_DEBUG_PANEL=true
    volumes:
      - ./app.py:/app/app.py
      - ./templates:/app/templates
    develop:
      watch:
        - action: sync
          path: ./app.py
          target: /app/app.py
          ignore:
            - __pycache__/
        - action: sync+restart
          path: ./templates/
          target: /app/templates/
