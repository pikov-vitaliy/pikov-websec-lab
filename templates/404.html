{% extends "base.html" %}

{% block title %}Pikov WebSec Lab — Страница не найдена{% endblock %}

{% block content %}
<section class="error-page" data-page="error" data-title-key="meta.notFound" aria-labelledby="errorTitle">
  <div class="error-code" aria-hidden="true">404</div>
  <div class="error-sheep" aria-hidden="true">🐑?</div>
  <p class="eyebrow" data-i18n="error.notFoundKicker">Маршрут не входит в сценарий</p>
  <h1 id="errorTitle" data-i18n="error.notFoundTitle">Овечка ушла с учебной тропы</h1>
  <p class="lede compact" data-i18n="error.notFoundBody">Проверьте адрес или вернитесь на стартовую страницу лаборатории.</p>
  <a class="button button-primary" href="/">
    <span aria-hidden="true">←</span>
    <span data-i18n="error.backHome">На стартовую страницу</span>
  </a>
</section>
{% endblock %}
