<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title description">
  <title id="title">Retired example payload</title>
  <desc id="description">A static migration notice for the safe Pikov WebSec Lab canary.</desc>
  <rect width="720" height="260" rx="28" fill="#f5f3ff"/>
  <rect x="20" y="20" width="680" height="220" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="4"/>
  <text x="54" y="96" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#312e81">Example retired for classroom safety</text>
  <text x="54" y="140" font-family="system-ui, sans-serif" font-size="19" fill="#4b5563">Use labs/svg-stored-xss/canary.svg in an isolated lab run.</text>
  <text x="54" y="178" font-family="system-ui, sans-serif" font-size="16" fill="#5b21b6">The new canary emits only local, correlated teaching evidence.</text>
